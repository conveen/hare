[workspace]
members = [
    "src/*",
]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.6", default-features = false }
prost = "0.12"
serde = { version = "1.0", default-features = false, features = [ "derive", "std" ] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", default-features = false, features = [ "macros" ] }
tonic = "0.11"
tonic-build = "0.11"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1.5.0", default-features = false, features = [ "fast-rng", "std", "v4" ] }

[profile.bench]
lto = "off"

[profile.release]
# The Cargo documentation purports similar performance to "fat" LTO with faster compilation speeds
# See: https://doc.rust-lang.org/cargo/reference/profiles.html#lto
lto = "thin"
panic = "abort"

# Profile for maximum optimization with "fat" LTO and codegen unit of 1
[profile.release-fat-lto]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
